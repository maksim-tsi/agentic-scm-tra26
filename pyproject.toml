[project]
name = "agentic-scm-tra26"
version = "0.1.0"
description = "SCM-MAS evaluation harness (TRA 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0.0,<3",
  "openai",
  "anthropic",
  "python-dotenv",
  "structlog",
  "numpy",
  "scipy",
  "pulp",
  "pytest",
  "arize-phoenix-otel>=0.15.0",
  "arize-phoenix-client>=2.2.0",
  "openinference-instrumentation-openai>=0.1.43",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
